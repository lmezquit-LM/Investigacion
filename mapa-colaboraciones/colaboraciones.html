<style>
:root{--bg:#fff;--panel:#fff;--ink:#12394f;--muted:#666b70;--line:#d8d9d4;--accent:#0B3F5C;--r:14px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Montserrat,'Avenir Next','Segoe UI',Arial,sans-serif;color:var(--ink);background:#fff}
#app{height:100vh;min-height:420px;display:grid;grid-template-rows:auto 1fr}

.title{font-weight:750;margin-right:auto}select,input{font:inherit}.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(245px,29vw,410px);gap:10px;padding:10px}

#worldPlot{width:100%;height:100%}.side{padding:12px;overflow:auto}.side h2{font-size:16px;margin:0 0 8px}.hint,.meta{color:var(--muted);font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}.kpi div{background:#f7f9fc;border-radius:9px;padding:8px}.kpi strong{display:block;font-size:18px}
.person{padding:8px 0;border-top:1px solid var(--line)}.person b{font-size:13px}.person div{font-size:12px;color:var(--muted)}
@media(max-width:720px){.main{grid-template-columns:1fr;grid-template-rows:minmax(250px,1fr) minmax(150px,42%)}.title{width:100%}}
</style>
<style id="genially-embed-style">
:root{--bg:#fff!important;--blue:#0B3F5C;--green:#19B94B;--gold:#EAB51D;--yellow:#EAB51D;--grey:#9FA09A}
html,body{background:#fff!important;min-height:100%;overflow-x:hidden}
.page{max-width:none!important;margin:0!important;padding:12px 14px 16px!important}
.panel,.metric,.card,.timeline-wrap,.drawer-card{background:#fff!important;box-shadow:0 8px 24px rgba(11,63,92,.07)!important}
.home,.version{display:none!important}
@media(max-width:700px){.page{padding:8px!important}}
</style>
