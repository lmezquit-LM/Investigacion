const map=L.map('map',{zoomControl:true,worldCopyJump:true}).setView([30,5],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map),slider=document.getElementById('slider'),yearEl=document.getElementById('year'),detail=document.getElementById('detail');
let timer=null, selectedGroup=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
function visibleRecords(group,year){return group.records.filter(r=>r.year<=year)}
function radius(n){return Math.max(6,Math.min(24,5+Math.sqrt(n)*2.2))}
function show(group,year){
 selectedGroup=group;
 const works=visibleRecords(group,year).slice().sort((a,b)=>(b.year-a.year)||(b.id-a.id));
 detail.classList.remove('empty');
 detail.innerHTML=`<h2>${esc(group.city)}</h2><div class="citymeta">${esc(group.country)} · ${works.length} trabajo${works.length===1?'':'s'} hasta ${year}</div>`+
 works.map(r=>`<article class="work"><div class="worktop"><span class="workyear">${r.year}</span><div class="badges"><span class="badge">${esc(r.type)}</span><span class="badge">${esc(r.scope)}</span>${r.acts?'<span class="badge">En actas</span>':''}${r.leadership?'<span class="badge">Liderazgo</span>':''}${r.award?'<span class="badge award">Premio</span>':''}</div></div><h3 title="${esc(r.title)}">${esc(r.title)}</h3><div class="congress-name">${esc(r.congress)}</div><div class="record-id">ID del CV: ${r.id}</div></article>`).join('');
}
function draw(year){
 yearEl.textContent=year;layer.clearLayers();if(selectedGroup)show(selectedGroup,year);
 DATA.forEach(g=>{const works=visibleRecords(g,year);if(!works.length)return;
   const marker=L.circleMarker([g.lat,g.lon],{radius:radius(works.length),color:'#fff',weight:1.5,fillColor:g.country==='España'?'#0B3F5C':'#EAB51D',fillOpacity:.84});
   marker.bindTooltip(`<strong>${esc(g.city)}</strong><br>${works.length} trabajo${works.length===1?'':'s'}`,{direction:'top'});
   marker.on('click',()=>show(g,year));marker.addTo(layer);
 });
}
slider.addEventListener('input',e=>draw(Number(e.target.value)));
document.getElementById('spain').onclick=()=>map.flyTo([40.15,-3.5],6,{duration:1});
document.getElementById('virtual').onclick=()=>show({city:'Virtual',country:'Participación en línea',records:VIRTUAL},Number(slider.value));
document.getElementById('world').onclick=()=>map.flyTo([30,5],2,{duration:1});
document.getElementById('play').onclick=function(){
 if(timer){clearInterval(timer);timer=null;this.textContent='▶ Reproducir';return}
 if(Number(slider.value)>=2026)slider.value=2006;
 draw(Number(slider.value));this.textContent='❚❚ Pausar';
 timer=setInterval(()=>{const next=Number(slider.value)+1;if(next>2026){clearInterval(timer);timer=null;this.textContent='▶ Reproducir';return}slider.value=next;draw(next)},650);
};
draw(2006);
const requestedId=Number(new URLSearchParams(location.search).get('id'));
const requestedGroup=DATA.find(g=>g.records.some(r=>r.id===requestedId)) || (VIRTUAL.some(r=>r.id===requestedId)?{city:'Virtual',country:'Participación en línea',records:VIRTUAL}:null);
if(requestedGroup){const record=requestedGroup.records.find(r=>r.id===requestedId);slider.value=record.year;draw(record.year);show(requestedGroup,record.year);if(record.coords)map.flyTo(record.coords,6,{duration:1});}
</script></body></html>
